<header class="site-header">
  <canvas id="nav-pixels" aria-hidden="true"></canvas>
  <div class="wrap">
    <a class="logo" href="index.html">
      <img src="assets/logo.png" alt="" width="512" height="512">
      Emphatic <span class="dim">Labs</span>
    </a>

      <a href="careers.html">Careers</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main>

  <section class="hero" style="padding-bottom:56px">
    <div class="wrap">
      <h1>Get in touch.</h1>
      <p class="lede">
        We read everything that comes in.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="contact-grid">

        <div>
          <a class="channel" href="mailto:quinngifford@emphaticlab.com">
            <span class="k">General</span>
            <span class="v">quinngifford@emphaticlab.com</span>
          </a>
          <a class="channel" href="mailto:careers@emphaticlab.com">
            <span class="k">Careers</span>
            <span class="v">careers@emphaticlab.com</span>
          </a>
          <a class="channel" href="careers.html">
            <span class="k">Open roles</span>
            <span class="v">4 positions &rarr;</span>
          </a>
        </div>

        <div>
          <!-- Static form: point `action` at a form service (Formspree, Basin, Vercel
               function) before launch. Right now it posts nowhere. -->
          <form action="#" method="POST">
            <div>
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required placeholder="Your name">
            </div>
            <div>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required placeholder="you@example.com">
            </div>
            <div>
              <label for="message">Message</label>
              <textarea id="message" name="message" required placeholder="How can we help?"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Send</button>
          </form>
        </div>

      </div>
    </div>
  </section>

</main>
